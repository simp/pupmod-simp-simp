# Sicura Compliance Engine checks that restore the behavior this module's
# classes had by default *before* their blast-radius refactors (where a bare
# include manages nothing):
#
# * `simp::kmod_blacklist` (10.0.0)
# * `simp::sysctl` (11.0.0)
#
# One `puppet-class-parameter` check per restored parameter; the
# `simp:defaults` profile lists them directly (see profile-simp_defaults.yaml).
#
# Scope is intentionally limited to this module's own parameters.
---
version: 2.0.0
checks:
  # Pre-10.0.0: this SCAP Security Guide blacklist was the hardcoded default
  # for `simp::kmod_blacklist::blacklist` and was enforced on every include.
  # The class default is now empty; the list lives here, as the `modules`
  # Hash. Sites can layer `ensure: absent` (or any other kmod::blacklist
  # parameter) over individual entries in their own Hiera via deep merge.
  simp:defaults.simp.kmod_blacklist.modules:
    type: puppet-class-parameter
    settings:
      parameter: simp::kmod_blacklist::modules
      value:
        bluetooth: {}
        cramfs: {}
        dccp: {}
        dccp_ipv4: {}
        dccp_ipv6: {}
        freevxfs: {}
        hfs: {}
        hfsplus: {}
        ieee1394: {}
        jffs2: {}
        net-pf-31: {}
        rds: {}
        sctp: {}
        squashfs: {}
        tipc: {}
        udf: {}
        usb-storage: {}
  # Pre-10.0.0: `kernel.modules_disabled` was managed (unlocked) on every
  # include where the sysctl is available
  simp:defaults.simp.kmod_blacklist.lock_modules:
    type: puppet-class-parameter
    settings:
      parameter: simp::kmod_blacklist::lock_modules
      value: false
  # Pre-11.0.0: every `simp::sysctl` key below had this value as its hardcoded
  # default and was enforced on every include. The class defaults are now
  # `undef` (key not managed).
  simp:defaults.simp.sysctl.net__netfilter__nf_conntrack_max:
    type: puppet-class-parameter
    settings:
      parameter: simp::sysctl::net__netfilter__nf_conntrack_max
      value: 655360
  simp:defaults.simp.sysctl.net__unix__max_dgram_qlen:
